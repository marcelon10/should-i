version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all patch bumps instead of nine. Review fatigue is the
      # main reason Dependabot gets switched off.
      python-patches:
        update-types: ["patch"]
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pre-commit", "sqlfluff*"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
