name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the previous run. Without this you pay
# for CI on commits nobody will ever look at again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # --- fast feedback: these run in parallel and fail in well under a minute
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy .

  sql:
    name: SQL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - run: pip install sqlfluff
      - run: sqlfluff lint transform/models

  # --- correctness --------------------------------------------------------
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # show all failures, not just the first
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest (enforces the 90% coverage gate)
        run: python -m pytest
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # --- does the whole thing actually run from a clean clone? --------------
  e2e:
    name: End-to-end (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Full pipeline, no network
        run: |
          python scripts/make_fixture.py
          python -m ingestion.run weather --offline
          python -m transform.build_local
          python -m quality.checks
          python -m serving.morning
      - name: Re-run must be idempotent
        run: |
          python -m ingestion.run weather --offline
          python -m transform.build_local
          python scripts/assert_idempotent.py

  # --- dbt models compile against a real dbt install ----------------------
  dbt:
    name: dbt build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - run: pip install -e ".[transform]"
      - name: Seed a warehouse for dbt to build on
        run: |
          python scripts/make_fixture.py
          python -m ingestion.run weather --offline
      - name: dbt deps + build
        run: |
          dbt deps  --project-dir transform --profiles-dir transform
          dbt build --project-dir transform --profiles-dir transform
        continue-on-error: true   # phase 2 — make this required once adopted

  # --- supply chain -------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks needs history in order to scan it
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Scan history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pip-audit
      - name: Audit dependencies for known CVEs
        run: pip-audit --strict --desc

  # --- one required check to rule them all --------------------------------
  # Branch protection points at this single job. Add a job above and it
  # becomes blocking automatically — no settings change to forget.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, sql, test, e2e, security]
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks green."
