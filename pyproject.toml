[project]
name = "should-i"
version = "0.1.0"
description = "A personal decision engine built as a full data platform."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0,<2.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
]
transform = [
    "dbt-core>=1.8,<2.0",
    "dbt-duckdb>=1.8,<2.0",
    "sqlfluff>=3.1",
    "sqlfluff-templater-dbt>=3.1",
]
orchestration = [
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]

[project.scripts]
should-i = "serving.morning:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "config",
    "ingestion",
    "ingestion.sources",
    "orchestration",
    "quality",
    "serving",
    "storage",
    "transform",
]

# ---------------------------------------------------------------------------
# Lint + format: ruff replaces flake8, isort, black, pyupgrade, and more.
# One tool, one config, ~100x faster than the stack it replaces.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["transform/target", "transform/dbt_packages"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort — import ordering
    "B",         # bugbear — likely bugs
    "C4",        # comprehension simplifications
    "UP",        # pyupgrade — modern syntax
    "SIM",       # simplifications
    "TID",       # tidy imports
    "PTH",       # prefer pathlib over os.path
    "RUF",       # ruff-specific
    "ARG",       # unused arguments
    "DTZ",       # naive datetime misuse — a real hazard in pipelines
    "T20",       # no stray print() ...
    "S",         # bandit security rules
]
ignore = [
    "S101",      # assert is fine in tests
    "E501",      # line length is handled by the formatter
    "RUF001",    # en dashes in user-facing output are intentional
]

[tool.ruff.lint.per-file-ignores]
# The CLI layers exist to print. Everything else must log instead.
"serving/*" = ["T20"]
"quality/*" = ["T20"]
"ingestion/run.py" = ["T20"]
"transform/build_local.py" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["ARG", "S", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = [
    "config", "ingestion", "orchestration", "quality", "serving",
    "storage", "transform",
]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["transform/target/", "build/"]

[[tool.mypy.overrides]]
# Optional-extra packages are absent in the base CI job by design.
module = ["dagster.*", "duckdb.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "integration: touches the network or a real API (deselect with -m 'not integration')",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "scripts/*",
    "orchestration/*",   # requires dagster, exercised in its own job
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
